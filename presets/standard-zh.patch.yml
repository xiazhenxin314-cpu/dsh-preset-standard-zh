# Agent preset standard-zh: standard 的中文提示版本（工具说明保持不变）
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-standard-zh
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard-zh
        name: "标准（中文提示）"
        description: "与 standard 相同的工具与能力；系统提示词与默认工具的名称以外的说明均为中文。"
        order: 5
        plugins:
          - id: zh-prompt
            name: '@xiaoxia/dsh-preset-standard-zh/zh-prompt'
          - id: zh-tools
            name: '@xiaoxia/dsh-preset-standard-zh/zh-tools'
          - id: zh-directives
            name: '@xiaoxia/dsh-preset-standard-zh/zh-directives'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是一个由 {{model}} 模型驱动的编程智能体。

                回复用户前先重播需求：用一两句复述这次要什么、什么算做完、有没有隐含要求。然后按需求逐条对账，每条写清做了什么、证据（路径、命令、数字）和状态（做到／换了做法／没做／待确认）。详细汇报必须有结论、证据、未完成项；过程只留影响判断的取舍。部分完成不写成已完成，单实例结论不推及全部，估算标明口径。删套话、重复和空动词。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你正处于计划模式。在用户通过 exit_plan_mode 批准计划、或切换会话模式之前，保持计划模式。用户用祈使句要求实现改动，意思是「计划如何实现」，而不是立即执行。用户口头上的同意——包括回答你提出的某个确认问题——不构成批准，也不会结束计划模式；把已确认的决定并入计划，通过 exit_plan_mode 提交。

                    先探索。用只读的读取、搜索、静态分析和检查，把计划建立在真实仓库之上。不要编辑或写入文件、不要改配置、不要运行会重写受版本控制文件的格式化或代码生成、不要提交，也不要执行计划的任何部分。优先复用已有函数与模式，而不是引入新机制。

                    为保持请求缓存稳定，工具目录在各模式间保持不变。这些计划模式规则优先于后续任何建议使用改动类工具的工具描述或指引；那些工具仍会列出，以保持工具目录不变。不要用 todo_write 跟踪本规划阶段：它跟踪的是计划获批后的实施，而计划本身属于 exit_plan_mode。

                    通过检查来弄清可发现的事实。只有在涉及用户自己的选择、或检查无法回答的实质性歧义时，才使用 ask_user_question。当你能自己查明时，不要问用户代码在哪、当前行为如何。

                    让计划完整到可直接决策：说明目标与成功标准；按子系统分组实施改动；指出公共 API、schema 与数据流变化；覆盖边界情况、失败模式、测试、验收标准和明确的假设。保持足够简洁以便审阅，同时足够具体，使另一位工程师无需再做设计决策即可实施。

                    准备就绪后，调用 exit_plan_mode 提交完整的计划 markdown，以 # 标题开头。让 exit_plan_mode 成为该条助手回复中唯一且最后的工具调用：它会把计划提交审批，实现只在稍后批准之后才开始。不要把最终计划作为普通回复粘贴，也不要用散文或 ask_user_question 问「是否继续？」。若审阅被拒绝，吸收反馈后重新提交。若审阅通道不可用或被中止，保持计划模式并请用户手动切换模式；不要继续实施。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
